# Builds the site from a release tag and publishes it on GitHub Pages.
# A merge to main does not deploy; pushing a tag vX.Y.Z does. Candidate
# tags (vX.Y.Z-rc.N) are not deployed while there is no test environment.
name: Deploy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to deploy again, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.168.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag format
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${TAG}' is not a release tag vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${TAG} does not point to a commit on main"
            exit 1
          fi

      - name: Check the changelog section
        run: |
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section ## [${TAG#v}]"
            exit 1
          fi

      - name: Write the imprint address
        env:
          IMPRINT_ADDRESS: ${{ secrets.IMPRINT_ADDRESS }}
        run: |
          if [ -z "${IMPRINT_ADDRESS//[[:space:]]/}" ]; then
            echo "::error::The secret IMPRINT_ADDRESS is empty; the sample address must never go live"
            exit 1
          fi
          printf '%s\n' "${IMPRINT_ADDRESS}" > imprint.local.txt

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${deb}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          sudo dpkg -i "${deb}"
          hugo version

      - name: Run the gates
        run: bash .devkit/gates.sh

      - name: Build
        run: hugo build --gc --minify --panicOnWarning

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          # Keeps .well-known/security.txt, which the action drops otherwise.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
