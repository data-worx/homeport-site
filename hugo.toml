baseURL = "https://homeport.data-worx.de/"
title = "Homeport"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT"]

[languages]
  [languages.en]
    label = "English"
    weight = 1
  [languages.de]
    label = "Deutsch"
    weight = 2

[params]
  repo = "https://github.com/data-worx/homeport"

# The layouts need Hugo 0.158 or later: the template layout of 0.146 plus
# Language.Locale and Language.Label.
[module.hugoVersion]
  min = "0.158.0"

# Code blocks stay plain <pre><code>: Chroma's inline colours are fixed and
# would ignore the dark theme.
[markup.highlight]
  codeFences = false

# Every documentation page is also served as Markdown, next to its HTML.
[[cascade]]
  outputs = ["html", "markdown"]
  [cascade.target]
    path = "{/docs,/docs/**}"

# The index of the documentation for AI assistants, /llms.txt.
[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

# Written by the English start page only: the documentation is English only.
[[cascade]]
  outputs = ["html", "llms"]
  [cascade.target]
    path = "/"
    [cascade.target.sites.matrix]
      languages = ["en"]
