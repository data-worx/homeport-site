{{- /* Where the page comes from: the document in the Homeport tag. A reader
       section generated by the sync has no source and shows nothing. */}}
{{- with .Params.source }}
<p class="doc-source"><a href="{{ site.Params.repo }}/blob/{{ (site.GetPage "/docs").Params.homeportVersion }}/{{ . }}">{{ T "docsSource" }}</a></p>
{{- end }}
