<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ partial "logo.html" "light" }}</a>
    <nav class="top-nav" aria-label="{{ T "navMain" }}">
      {{- range .Translations }}
      <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" lang="{{ .Language.Locale }}">{{ .Language.Label }}</a>
      {{- end }}
      <a href="{{ site.Params.repo }}">GitHub</a>
      <button class="theme-switch" type="button" aria-pressed="false" title="{{ T "darkTheme" }}" hidden>
        <span class="visually-hidden">{{ T "darkTheme" }}</span>
        <span class="on-light">{{ partial "icon.html" "moon" }}</span>
        <span class="on-dark">{{ partial "icon.html" "sun" }}</span>
      </button>
    </nav>
  </div>
</header>
